x-tor: &tor
  build: ./docker/tor
  restart: unless-stopped
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=128m,mode=1777
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  healthcheck:
    test: ["CMD", "curl", "--fail", "--silent", "--max-time", "45", "--socks5-hostname", "127.0.0.1:9050", "https://check.torproject.org/api/ip"]
    interval: 60s
    timeout: 50s
    retries: 5
    start_period: 120s

services:
  examples: &examples
    profiles: [examples]
    build:
      context: .
      target: examples
    init: true
    shm_size: 1gb
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      TOR_PROXIES: socks5h://tor-1:9050,socks5h://tor-2:9050
      BROWSER_BACKEND: selenium
      HEADLESS: "true"
      CHROME_NO_SANDBOX: "true"
    depends_on:
      tor-1:
        condition: service_healthy
      tor-2:
        condition: service_healthy
  examples-camoufox:
    <<: *examples
    profiles: [camoufox]
    build:
      context: .
      target: fingerprint
    environment:
      TOR_PROXIES: socks5h://tor-1:9050,socks5h://tor-2:9050
      BROWSER_BACKEND: camoufox
      HEADLESS: "true"
  camoufox-dev:
    <<: *examples
    profiles: [dev]
    build:
      context: .
      target: fingerprint-dev
    restart: unless-stopped
    stop_grace_period: 100s
    environment:
      TOR_PROXIES: socks5h://tor-1:9050,socks5h://tor-2:9050
      BROWSER_BACKEND: camoufox
      HEADLESS: "true"
      PYTHONPATH: /app/src
      WATCHFILES_FORCE_POLLING: "true"
      WATCHFILES_POLL_DELAY_MS: "500"
      DEV_COMMAND: ${CAMOUFOX_DEV_COMMAND:-python examples/reusable_client.py}
    volumes:
      - ./src:/app/src:ro
      - ./examples:/app/examples:ro
      - ./runner.py:/app/runner.py:ro
  tor-1:
    <<: *tor
    ports: ["127.0.0.1:19050:9050"]
  tor-2:
    <<: *tor
    ports: ["127.0.0.1:19060:9050"]
